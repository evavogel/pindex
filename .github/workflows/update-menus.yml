name: Update menus and deploy

on:
  schedule:
    # GitHub often starts scheduled runs hours late, so several early slots make sure one lands
    # before lunch. Odd minutes are delayed less than the top of the hour. Times in UTC
    # (CET = UTC+1, CEST = UTC+2).
    - cron: "17 3 * * 1-5"
    - cron: "23 5 * * 1-5"
    - cron: "37 7 * * 1-5"
    - cron: "41 9 * * 1-5"
    - cron: "17 16,20 * * 0"  # Sunday: the scraper looks ahead to next week, so Monday is ready early
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main  # latest main, also for re-runs and queued runs (not the commit that triggered them)
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch menus
        if: github.event_name != 'push'  # code pushes only redeploy; menus come from scheduled or manual runs
        run: python -u scrape.py
        timeout-minutes: 10
        continue-on-error: true  # a source outage must not block deploying site changes
      - name: Commit menu data
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add docs/data/
          git diff --cached --quiet || git commit -m "Update menus $(date -u +%F)"
          # Another run may have pushed meanwhile; replay on top of it and keep this run's newer data.
          git pull --rebase -X theirs origin main
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deploy
        uses: actions/deploy-pages@v4
